services:
  lumina:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lumina
    restart: always
    ports:
      - "9501:9501"
      # Swagger UI (hyperf/swagger — servidor dedicado, ver config/autoload/swagger.php)
      - "9500:9500"
    volumes:
      - .:/opt/www
    environment:
      - APP_ENV=dev
      - SCAN_CACHEABLE=false
    env_file:
      - .env
    deploy:
      resources:
        limits:
          memory: 2GB
        reservations:
          memory: 1GB

  # Redis para Filas e Semáforos de Corrotinas
  redis:
    image: redis:alpine
    container_name: redis
    restart: always
    ports:
      - "6380:6379"

  # RabbitMQ para mensageria pesada (Opcional, mas recomendado para 500k registros)
  # hub-rabbitmq:
  #   image: rabbitmq:3-management-alpine
  #   container_name: hub-rabbitmq
  #   restart: always
  #   ports:
  #     - "5672:5672"
  #     - "15672:15672" # Painel de controle do RabbitMQ
  #   environment:
  #     RABBITMQ_DEFAULT_USER: guest
  #     RABBITMQ_DEFAULT_PASS: guest

  # Documentação (Swagger UI) do http.json gerado em storage/swagger
  lumina-docs:
    image: techsuperior/web-swagger
    container_name: lumina-docs
    working_dir: /swagger
    restart: unless-stopped
    depends_on:
      - lumina
    command: open-swagger-ui ./http.json
    ports:
      - "8082:3355" # 8081 já é usado pelo lms-api-doc do legado no mesmo uni_sup_network — conferir antes de subir
    volumes:
      - ./storage/swagger:/swagger
    deploy:
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 32M

networks:

  default:
    external: true
    name: uni_sup_network